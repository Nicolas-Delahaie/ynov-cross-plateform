<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Admin Dashboard</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h3 class="mb-1">Dataset Dashboard</h3>
          <div class="text-muted small">
            Total: {{ stats.total }} · Avec photo: {{ stats.with_photo }} ({{
            stats.pct_with_photo }}%) · Dernier import: {{ stats.last_import or
            "—" }}
          </div>
        </div>

        <button
          class="btn btn-warning"
          hx-post="/admin/import"
          hx-target="#cardsBlock"
          hx-swap="innerHTML"
        >
          Refresh / Import
        </button>
      </div>

      <div id="cardsBlock">{% include "_cards_grid.html" %}</div>
    </div>
  </body>
</html>
