<div
  hx-get="/admin/progress/{{ kind }}"
  hx-trigger="every 1s"
  hx-target="#{{ target_block }}"
  hx-swap="innerHTML"
>
  <div class="my-3">
    <div class="d-flex justify-content-between small text-muted mb-1">
      <span>{{ progress.phase }}</span>
      <span>
        {{ progress.imported }} importés · {{ progress.skipped }} ignorés
      </span>
    </div>
    <div class="progress" style="height: 26px">
      <div
        class="progress-bar progress-bar-striped progress-bar-animated bg-{{ bar_color }}"
        role="progressbar"
        style="width: {{ progress.pct }}%"
        aria-valuenow="{{ progress.pct }}"
        aria-valuemin="0"
        aria-valuemax="100"
      >
        {{ progress.current }}/{{ progress.total }} ({{ progress.pct }}%)
      </div>
    </div>
  </div>
</div>
